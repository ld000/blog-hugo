<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">生产级 agent 还需要认证、授权、审计和租户隔离</title>
  <desc id="desc">展示 agent 调用 Gmail、Slack、Jira、GitHub 等工具时，需要在工具调用前解决用户身份、权限范围、凭证管理和审计日志。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#8a8f98"/></marker>
    <style>
      .bg{fill:#010102}.panel{fill:#0f1011;stroke:#34343a;stroke-width:1.3}.box{fill:#17181b;stroke:#34343a;stroke-width:1.2}.guard{fill:#141517;stroke:#5e6ad2;stroke-width:1.8}.edge{fill:none;stroke:#8a8f98;stroke-width:2;marker-end:url(#arrow)}.line{stroke:#23252a;stroke-width:1}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Text","PingFang SC",sans-serif}.label{fill:#f7f8f8;font:650 27px "Inter","SF Pro Text","PingFang SC",sans-serif}.body{fill:#d7dadd;font:400 22px "Inter","SF Pro Text","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 21px "Inter","SF Pro Text","PingFang SC",sans-serif}.mono{fill:#aeb4bf;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <path class="line" d="M120 120h1200M120 728h1200"/>
  <text class="muted" x="120" y="84">Production boundary</text>
  <text class="title" x="120" y="146">Agent 能调工具，不代表已经能安全上线</text>
  <text class="body" x="120" y="188">一旦代表真实用户访问外部系统，就必须明确身份、权限、凭证和审计。</text>

  <rect class="box" x="120" y="372" width="190" height="96" rx="8"/>
  <text class="label" x="178" y="418">Agent</text>
  <text class="body" x="158" y="450">准备调用工具</text>

  <rect class="guard" x="410" y="300" width="350" height="240" rx="8"/>
  <text class="label" x="455" y="350">权限边界</text>
  <text class="body" x="455" y="398">谁授权了这次访问？</text>
  <text class="body" x="455" y="432">能访问哪些资源？</text>
  <text class="body" x="455" y="466">凭证如何保存和刷新？</text>
  <text class="body" x="455" y="500">动作如何审计？</text>

  <rect class="panel" x="860" y="270" width="460" height="300" rx="8"/>
  <text class="label" x="910" y="324">外部系统</text>
  <rect class="box" x="910" y="365" width="145" height="62" rx="7"/>
  <text class="body" x="952" y="403">Gmail</text>
  <rect class="box" x="1115" y="365" width="145" height="62" rx="7"/>
  <text class="body" x="1162" y="403">Slack</text>
  <rect class="box" x="910" y="466" width="145" height="62" rx="7"/>
  <text class="body" x="958" y="504">Jira</text>
  <rect class="box" x="1115" y="466" width="145" height="62" rx="7"/>
  <text class="body" x="1155" y="504">GitHub</text>

  <path class="edge" d="M310 420h88"/>
  <path class="edge" d="M760 420h88"/>
  <text class="mono" x="120" y="780">LangChain、LangGraph、LangSmith 解决 AI 工程问题；权限系统解决生产安全问题。</text>
</svg>
