<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Prompt、Context、Harness 共同支撑 Agent</title>
  <desc id="desc">概念图展示 Prompt 提供指令边界，Context 提供信息边界，Harness 提供运行边界，三者共同支撑 agent 行动。</desc>
  <defs>
    <style>
      .bg { fill: #010102; }
      .panel { fill: #0f1011; stroke: #252832; stroke-width: 1.2; }
      .panel-strong { fill: #111323; stroke: #5e6ad2; stroke-width: 1.8; }
      .soft { fill: #090a0c; stroke: #2f3440; stroke-width: 1.1; }
      .line { stroke: #4d5260; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .accent-line { stroke: #5e6ad2; stroke-width: 2; fill: none; marker-end: url(#arrowAccent); }
      .hairline { stroke: #23252a; stroke-width: 1; fill: none; }
      .muted { fill: #8a8f98; font: 400 22px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { fill: #f7f8f8; font: 650 40px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .label { fill: #f7f8f8; font: 650 30px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .small-label { fill: #f7f8f8; font: 650 23px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .body { fill: #d7dadd; font: 400 22px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
      .mono { fill: #aeb4bf; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .chip { fill: #151821; stroke: #343842; stroke-width: 1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4d5260"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e6ad2"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="860"/>
  <path class="hairline" d="M120 224h1200M120 738h1200"/>

  <text class="muted" x="120" y="92">Agent layers</text>
  <text class="title" x="120" y="154">三种边界共同支撑 agent 行动</text>
  <text class="body" x="120" y="196">Prompt 告诉模型按什么规则想，Context 告诉模型当前知道什么，Harness 决定系统实际怎么跑。</text>

  <rect class="panel-strong" x="428" y="246" width="584" height="150" rx="8"/>
  <text class="mono" x="466" y="290">agent</text>
  <text class="label" x="560" y="338">模型 + 可执行运行层</text>
  <text class="body" x="514" y="372">能回答，也能调用工具、保存状态、等待审批</text>

  <path class="accent-line" d="M720 500v-86"/>
  <path class="line" d="M382 548c72-72 170-116 284-134"/>
  <path class="line" d="M1058 548c-72-72-170-116-284-134"/>

  <rect class="panel" x="120" y="500" width="360" height="198" rx="8"/>
  <line class="accent-line" x1="154" y1="540" x2="238" y2="540" marker-end="none"/>
  <text class="label" x="154" y="590">Prompt</text>
  <text class="body" x="154" y="630">指令边界</text>
  <rect class="chip" x="154" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="172" y="679">角色</text>
  <rect class="chip" x="252" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="270" y="679">目标</text>
  <rect class="chip" x="350" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="368" y="679">格式</text>

  <rect class="panel" x="540" y="500" width="360" height="198" rx="8"/>
  <line class="accent-line" x1="574" y1="540" x2="658" y2="540" marker-end="none"/>
  <text class="label" x="574" y="590">Context</text>
  <text class="body" x="574" y="630">信息边界</text>
  <rect class="chip" x="574" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="592" y="679">输入</text>
  <rect class="chip" x="672" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="690" y="679">检索</text>
  <rect class="chip" x="770" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="788" y="679">历史</text>

  <rect class="panel" x="960" y="500" width="360" height="198" rx="8"/>
  <line class="accent-line" x1="994" y1="540" x2="1078" y2="540" marker-end="none"/>
  <text class="label" x="994" y="590">Harness</text>
  <text class="body" x="994" y="630">运行边界</text>
  <rect class="chip" x="994" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="1012" y="679">循环</text>
  <rect class="chip" x="1092" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="1110" y="679">权限</text>
  <rect class="chip" x="1190" y="656" width="86" height="34" rx="6"/>
  <text class="mono" x="1208" y="679">观测</text>

  <rect class="soft" x="260" y="276" width="132" height="58" rx="8"/>
  <text class="small-label" x="294" y="313">怎么想</text>
  <path class="line" d="M392 305h82"/>

  <rect class="soft" x="1048" y="276" width="132" height="58" rx="8"/>
  <text class="small-label" x="1074" y="313">怎么跑</text>
  <path class="line" d="M1048 305h-82"/>

  <text class="muted" x="120" y="792">边界越接近真实副作用，越需要 Harness 接管：工具、权限、状态、审批、沙箱和 trace。</text>
</svg>
