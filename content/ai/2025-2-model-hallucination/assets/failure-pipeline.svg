<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">一次回答里可能产生幻觉的位置</title>
  <desc id="desc">一张深色流程图，展示用户问题、检索上下文、提示词、模型生成、后处理和最终回答之间的幻觉风险点。</desc>
  <defs>
    <style>
      .bg { fill: #010102; }
      .panel { fill: #0f1011; stroke: #23252a; stroke-width: 1; }
      .risk { fill: #141516; stroke: #5e6ad2; stroke-width: 1.5; }
      .line { stroke: #34343a; stroke-width: 2; fill: none; }
      .accent { stroke: #5e6ad2; stroke-width: 3; fill: none; }
      .arrow { fill: #8a8f98; }
      .muted { fill: #8a8f98; font: 400 24px "Inter","SF Pro Text","PingFang SC", sans-serif; letter-spacing: 0; }
      .title { fill: #f7f8f8; font: 650 42px "Inter","SF Pro Text","PingFang SC", sans-serif; letter-spacing: 0; }
      .label { fill: #f7f8f8; font: 650 28px "Inter","SF Pro Text","PingFang SC", sans-serif; letter-spacing: 0; }
      .body { fill: #d0d6e0; font: 400 22px "Inter","SF Pro Text","PingFang SC", sans-serif; letter-spacing: 0; }
      .small { fill: #8a8f98; font: 400 19px "Inter","SF Pro Text","PingFang SC", sans-serif; letter-spacing: 0; }
      .mono { fill: #aeb4bf; font: 500 19px "JetBrains Mono","SFMono-Regular",monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 128h1200M120 690h1200"/>

  <text class="muted" x="120" y="92">Failure pipeline</text>
  <text class="title" x="120" y="154">幻觉可能不只发生在模型内部</text>
  <text class="body" x="120" y="196">检索、上下文拼装、工具结果解释和最终总结，都可能把错误带进答案。</text>

  <g transform="translate(120 292)">
    <rect class="panel" x="0" y="0" width="180" height="140" rx="8"/>
    <line class="accent" x1="28" y1="30" x2="88" y2="30"/>
    <text class="label" x="28" y="76">问题</text>
    <text class="small" x="28" y="112">前提可能不清</text>
  </g>

  <g transform="translate(340 292)">
    <rect class="risk" x="0" y="0" width="200" height="140" rx="8"/>
    <line class="accent" x1="28" y1="30" x2="88" y2="30"/>
    <text class="label" x="28" y="76">检索</text>
    <text class="small" x="28" y="112">证据可能拿错</text>
  </g>

  <g transform="translate(580 292)">
    <rect class="risk" x="0" y="0" width="200" height="140" rx="8"/>
    <line class="accent" x1="28" y1="30" x2="88" y2="30"/>
    <text class="label" x="28" y="76">Prompt</text>
    <text class="small" x="28" y="112">约束可能太弱</text>
  </g>

  <g transform="translate(820 292)">
    <rect class="risk" x="0" y="0" width="200" height="140" rx="8"/>
    <line class="accent" x1="28" y1="30" x2="88" y2="30"/>
    <text class="label" x="28" y="76">生成</text>
    <text class="small" x="28" y="112">缺证据仍补全</text>
  </g>

  <g transform="translate(1060 292)">
    <rect class="risk" x="0" y="0" width="200" height="140" rx="8"/>
    <line class="accent" x1="28" y1="30" x2="88" y2="30"/>
    <text class="label" x="28" y="76">总结</text>
    <text class="small" x="28" y="112">工具结果被改写</text>
  </g>

  <g stroke="#34343a" stroke-width="2" fill="none">
    <path d="M300 362h40"/>
    <path d="M540 362h40"/>
    <path d="M780 362h40"/>
    <path d="M1020 362h40"/>
  </g>
  <g class="arrow">
    <path d="M340 362l-12-7v14z"/>
    <path d="M580 362l-12-7v14z"/>
    <path d="M820 362l-12-7v14z"/>
    <path d="M1060 362l-12-7v14z"/>
  </g>

  <g transform="translate(212 520)">
    <rect class="panel" x="0" y="0" width="1016" height="102" rx="8"/>
    <text class="mono" x="36" y="44">只看最终答案：很难知道错在检索、上下文、模型，还是最后一步总结</text>
    <text class="small" x="36" y="76">所以线上系统需要 trace、证据绑定和验证步骤，而不是只保存 answer 字段。</text>
  </g>
</svg>
