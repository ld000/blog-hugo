<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">不同复杂度下是否需要引入 LangChain、LangGraph、LangSmith</title>
  <desc id="desc">一张决策表，展示单次模型调用、RAG、简单工具调用、复杂 agent、生产级 agent 分别适合哪些工具。</desc>
  <defs>
    <style>
      .bg{fill:#0f0f0f}.table{fill:#151515;stroke:#343434;stroke-width:1.3}.cell{fill:#181818;stroke:#303030;stroke-width:1}.head{fill:#202020;stroke:#383838;stroke-width:1}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.label{fill:#fff;font:650 23px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 20px "Instrument Sans","Inter","PingFang SC",sans-serif}.yes{fill:#9ad6ff;font:650 23px "Instrument Sans","Inter","PingFang SC",sans-serif}.maybe{fill:#ffd59a;font:650 23px "Instrument Sans","Inter","PingFang SC",sans-serif}.no{fill:#777;font:650 23px "Instrument Sans","Inter","PingFang SC",sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <path class="line" d="M120 120h1200M120 770h1200"/>
  <text class="muted" x="120" y="84">Decision guide</text>
  <text class="title" x="120" y="146">不要一开始就默认上全套</text>
  <text class="body" x="120" y="188">复杂度越高，越需要框架、流程控制和观测评估。</text>

  <rect class="table" x="120" y="250" width="1200" height="450" rx="8"/>
  <rect class="head" x="120" y="250" width="1200" height="72" rx="8"/>
  <text class="label" x="165" y="296">场景</text>
  <text class="label" x="610" y="296">LangChain</text>
  <text class="label" x="810" y="296">LangGraph</text>
  <text class="label" x="1018" y="296">LangSmith</text>

  <g>
    <rect class="cell" x="120" y="322" width="1200" height="76"/>
    <text class="body" x="165" y="369">一次模型调用</text>
    <text class="no" x="650" y="369">不需要</text>
    <text class="no" x="850" y="369">不需要</text>
    <text class="no" x="1060" y="369">不需要</text>
  </g>
  <g>
    <rect class="cell" x="120" y="398" width="1200" height="76"/>
    <text class="body" x="165" y="445">RAG 或简单工具调用</text>
    <text class="maybe" x="650" y="445">可以</text>
    <text class="no" x="850" y="445">可先不用</text>
    <text class="maybe" x="1060" y="445">建议</text>
  </g>
  <g>
    <rect class="cell" x="120" y="474" width="1200" height="76"/>
    <text class="body" x="165" y="521">多步骤 pipeline</text>
    <text class="yes" x="650" y="521">适合</text>
    <text class="maybe" x="850" y="521">看分支</text>
    <text class="yes" x="1060" y="521">适合</text>
  </g>
  <g>
    <rect class="cell" x="120" y="550" width="1200" height="76"/>
    <text class="body" x="165" y="597">复杂 agent</text>
    <text class="yes" x="650" y="597">适合</text>
    <text class="yes" x="850" y="597">适合</text>
    <text class="yes" x="1060" y="597">适合</text>
  </g>
  <g>
    <rect class="cell" x="120" y="626" width="1200" height="74"/>
    <text class="body" x="165" y="673">生产级多租户 agent</text>
    <text class="yes" x="650" y="673">适合</text>
    <text class="yes" x="850" y="673">适合</text>
    <text class="yes" x="1060" y="673">适合</text>
  </g>

  <text class="muted" x="120" y="822">最后一行还需要额外的认证、授权、审计和租户隔离，这不是这三者单独能解决的。</text>
</svg>
