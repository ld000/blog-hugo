<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LangChain, LangGraph, LangSmith 的三层关系</title>
  <desc id="desc">一张深色技术图，展示 LangChain 负责能力组件，LangGraph 负责执行流程，LangSmith 负责运行可见性。</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity=".32"/>
    </filter>
    <style>
      .bg { fill: #0f0f0f; }
      .hairline { stroke: #2f2f2f; stroke-width: 1; }
      .muted { fill: #9b9b9b; font: 400 24px "Instrument Sans", "Inter", "PingFang SC", sans-serif; }
      .title { fill: #ffffff; font: 650 42px "Instrument Sans", "Inter", "PingFang SC", sans-serif; letter-spacing: 0; }
      .label { fill: #ffffff; font: 650 32px "Instrument Sans", "Inter", "PingFang SC", sans-serif; letter-spacing: 0; }
      .body { fill: #cfcfcf; font: 400 24px "Instrument Sans", "Inter", "PingFang SC", sans-serif; letter-spacing: 0; }
      .mono { fill: #b8b8b8; font: 500 21px "JetBrains Mono", "SFMono-Regular", monospace; letter-spacing: 0; }
      .accent1 { stroke: #9ad6ff; }
      .accent2 { stroke: #d7c4ff; }
      .accent3 { stroke: #ffd59a; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="820"/>
  <path class="hairline" d="M120 128h1200M120 692h1200"/>

  <text class="muted" x="120" y="92">AI engineering stack</text>
  <text class="title" x="120" y="154">三个名字，不是同一层问题</text>
  <text class="body" x="120" y="196">从能力组件，到执行控制，再到线上可见性。</text>

  <g filter="url(#shadow)">
    <rect x="120" y="270" width="360" height="270" rx="8" fill="url(#panel)" stroke="#303030"/>
    <rect x="540" y="270" width="360" height="270" rx="8" fill="url(#panel)" stroke="#303030"/>
    <rect x="960" y="270" width="360" height="270" rx="8" fill="url(#panel)" stroke="#303030"/>
  </g>

  <g>
    <line class="accent1" x1="156" y1="306" x2="260" y2="306" stroke-width="3"/>
    <text class="label" x="156" y="360">LangChain</text>
    <text class="body" x="156" y="410">模型、Prompt、Tools、</text>
    <text class="body" x="156" y="446">RAG 和 Agent 的组件层</text>
    <text class="mono" x="156" y="500">能力组件 / integrations</text>
  </g>

  <g>
    <line class="accent2" x1="576" y1="306" x2="680" y2="306" stroke-width="3"/>
    <text class="label" x="576" y="360">LangGraph</text>
    <text class="body" x="576" y="410">节点、条件边、共享状态、</text>
    <text class="body" x="576" y="446">循环和人工介入</text>
    <text class="mono" x="576" y="500">执行流程 / orchestration</text>
  </g>

  <g>
    <line class="accent3" x1="996" y1="306" x2="1100" y2="306" stroke-width="3"/>
    <text class="label" x="996" y="360">LangSmith</text>
    <text class="body" x="996" y="410">Trace、Debug、Evaluation、</text>
    <text class="body" x="996" y="446">Prompt 实验和监控</text>
    <text class="mono" x="996" y="500">运行可见性 / observability</text>
  </g>

  <g fill="none" stroke="#585858" stroke-width="2">
    <path d="M488 405h42"/>
    <path d="M908 405h42"/>
  </g>
  <g fill="#777777">
    <path d="M530 405l-12-7v14z"/>
    <path d="M950 405l-12-7v14z"/>
  </g>

  <text class="muted" x="120" y="642">记法：LangChain 管能做什么，LangGraph 管怎么走，LangSmith 管发生了什么。</text>
</svg>
