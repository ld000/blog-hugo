<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">一次模型调用和一个 AI 应用系统的区别</title>
  <desc id="desc">左侧展示简单 API 调用，右侧展示包含检索、提示词、模型、工具和观测的 AI 应用系统。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2l8 4-8 4z" fill="#8a8a8a"/>
    </marker>
    <style>
      .bg{fill:#0f0f0f}.panel{fill:#151515;stroke:#343434;stroke-width:1.3}.box{fill:#1a1a1a;stroke:#3b3b3b;stroke-width:1.2}.line{stroke:#303030;stroke-width:1}.edge{fill:none;stroke:#8a8a8a;stroke-width:2;marker-end:url(#arrow)}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.h{fill:#fff;font:650 30px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 23px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 19px "JetBrains Mono","SFMono-Regular",monospace}.blue{stroke:#9ad6ff}.purple{stroke:#d7c4ff}
    </style>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">从 prompt 到 system</text>
  <text class="title" x="120" y="146">复杂度不是来自模型，而是来自模型周围的系统</text>
  <text class="body" x="120" y="188">一次调用只要请求和响应；一个应用要处理上下文、工具、状态、质量和成本。</text>

  <rect class="panel" x="120" y="270" width="520" height="330" rx="8"/>
  <line class="blue" x1="160" y1="316" x2="260" y2="316" stroke-width="3"/>
  <text class="h" x="160" y="365">一次 API 调用</text>
  <rect class="box" x="170" y="420" width="120" height="70" rx="7"/>
  <text class="body" x="205" y="464">输入</text>
  <rect class="box" x="360" y="420" width="120" height="70" rx="7"/>
  <text class="body" x="397" y="464">模型</text>
  <rect class="box" x="520" y="420" width="80" height="70" rx="7"/>
  <text class="body" x="538" y="464">输出</text>
  <path class="edge" d="M290 455h58"/>
  <path class="edge" d="M480 455h28"/>
  <text class="mono" x="174" y="548">prompt in, text out</text>

  <rect class="panel" x="720" y="270" width="600" height="330" rx="8"/>
  <line class="purple" x1="760" y1="316" x2="860" y2="316" stroke-width="3"/>
  <text class="h" x="760" y="365">AI 应用系统</text>
  <rect class="box" x="760" y="415" width="118" height="58" rx="7"/>
  <text class="body" x="796" y="452">用户</text>
  <rect class="box" x="932" y="390" width="126" height="58" rx="7"/>
  <text class="body" x="965" y="427">检索</text>
  <rect class="box" x="932" y="480" width="126" height="58" rx="7"/>
  <text class="body" x="966" y="517">工具</text>
  <rect class="box" x="1112" y="415" width="128" height="58" rx="7"/>
  <text class="body" x="1143" y="452">模型</text>
  <path class="edge" d="M878 444h42"/>
  <path class="edge" d="M1058 419h42"/>
  <path class="edge" d="M1058 509c56 0 56-65 42-65"/>
  <text class="mono" x="760" y="560">pipeline, tools, traces, evals</text>
  <text class="muted" x="120" y="742">LangChain、LangGraph、LangSmith 只有在右边这种复杂度里才开始变得有价值。</text>
</svg>
