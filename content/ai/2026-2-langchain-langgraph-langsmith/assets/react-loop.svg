<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">Agent 的 ReAct 循环</title>
  <desc id="desc">展示 agent 反复经历分析任务、选择工具、执行动作、观察结果、判断是否完成的循环。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#d7c4ff"/></marker>
    <style>
      .bg{fill:#0f0f0f}.node{fill:#171717;stroke:#3a3a3a;stroke-width:1.3}.edge{fill:none;stroke:#d7c4ff;stroke-width:2.5;marker-end:url(#arrow)}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.label{fill:#fff;font:650 28px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 22px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <path class="line" d="M120 120h1200M120 728h1200"/>
  <text class="muted" x="120" y="84">Agent loop</text>
  <text class="title" x="120" y="146">Agent 不是一条直线，而是一个循环</text>
  <text class="body" x="120" y="188">它不断分析、行动、观察，再决定继续还是结束。</text>

  <rect class="node" x="570" y="245" width="300" height="92" rx="8"/>
  <text class="label" x="652" y="299">分析任务</text>
  <text class="body" x="638" y="326">我现在缺什么信息？</text>

  <rect class="node" x="905" y="390" width="300" height="92" rx="8"/>
  <text class="label" x="987" y="444">选择工具</text>
  <text class="body" x="968" y="471">搜索、数据库、API</text>

  <rect class="node" x="570" y="535" width="300" height="92" rx="8"/>
  <text class="label" x="652" y="589">观察结果</text>
  <text class="body" x="632" y="616">工具返回了什么？</text>

  <rect class="node" x="235" y="390" width="300" height="92" rx="8"/>
  <text class="label" x="318" y="444">判断完成</text>
  <text class="body" x="312" y="471">够了就输出答案</text>

  <path class="edge" d="M820 337c88 16 128 42 160 54"/>
  <path class="edge" d="M1055 482c-28 72-92 102-174 99"/>
  <path class="edge" d="M570 581c-82 3-146-27-174-99"/>
  <path class="edge" d="M385 390c32-78 96-124 174-99"/>

  <text class="mono" x="120" y="780">LangGraph 的价值：把这个循环、分支和状态显式建模，而不是藏在一段脚本里。</text>
</svg>
