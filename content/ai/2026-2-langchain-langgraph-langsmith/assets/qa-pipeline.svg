<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">文档问答系统的完整 pipeline</title>
  <desc id="desc">展示用户问题经过向量检索、上下文组装、模型回答、格式化和引用输出的过程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#8a8a8a"/></marker>
    <style>
      .bg{fill:#0f0f0f}.node{fill:#171717;stroke:#353535;stroke-width:1.3}.store{fill:#141414;stroke:#4a4a4a;stroke-width:1.2;stroke-dasharray:8 8}.edge{fill:none;stroke:#8a8a8a;stroke-width:2;marker-end:url(#arrow)}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.label{fill:#fff;font:650 26px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 22px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">RAG pipeline</text>
  <text class="title" x="120" y="146">内部文档问答不是一次模型调用</text>
  <text class="body" x="120" y="188">答案质量取决于检索、上下文组装、模型生成和引用输出这几步是否都正确。</text>

  <rect class="node" x="120" y="330" width="170" height="96" rx="8"/>
  <text class="label" x="158" y="374">用户问题</text>
  <text class="body" x="156" y="406">退款规则？</text>
  <rect class="node" x="360" y="330" width="170" height="96" rx="8"/>
  <text class="label" x="398" y="374">检索</text>
  <text class="body" x="392" y="406">相似文档</text>
  <rect class="store" x="360" y="492" width="170" height="96" rx="8"/>
  <text class="label" x="395" y="536">向量库</text>
  <text class="mono" x="389" y="568">policy chunks</text>
  <rect class="node" x="600" y="330" width="190" height="96" rx="8"/>
  <text class="label" x="636" y="374">组装 Prompt</text>
  <text class="body" x="638" y="406">问题加上下文</text>
  <rect class="node" x="860" y="330" width="170" height="96" rx="8"/>
  <text class="label" x="900" y="374">模型</text>
  <text class="body" x="892" y="406">生成答案</text>
  <rect class="node" x="1100" y="330" width="220" height="96" rx="8"/>
  <text class="label" x="1140" y="374">输出</text>
  <text class="body" x="1136" y="406">答案加引用来源</text>
  <path class="edge" d="M290 378h58"/>
  <path class="edge" d="M445 492v-54"/>
  <path class="edge" d="M530 378h58"/>
  <path class="edge" d="M790 378h58"/>
  <path class="edge" d="M1030 378h58"/>
  <text class="muted" x="120" y="742">LangChain 的很多抽象，就是为了少重复写这些管道里的通用连接代码。</text>
</svg>
