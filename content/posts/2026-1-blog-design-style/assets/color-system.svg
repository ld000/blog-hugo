<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">网站的颜色系统</title>
  <desc id="desc">展示网站使用的近黑画布、灰阶文字、细分割线和单一强调色。</desc>
  <defs><style>
    .bg{fill:#010102}.line{stroke:#23252a;stroke-width:1}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Display","PingFang SC",sans-serif}.h{fill:#f7f8f8;font:650 24px "Inter","SF Pro Display","PingFang SC",sans-serif}.body{fill:#d0d6e0;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.mono{fill:#d0d6e0;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}.sw{stroke:#34343a;stroke-width:1.2}
  </style></defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">Color system</text>
  <text class="title" x="120" y="146">颜色只做层级，不做装饰主角</text>
  <text class="body" x="120" y="188">大部分页面由近黑画布、灰阶文字和单一强调色构成。</text>
  <g transform="translate(120 285)">
    <rect class="sw" width="160" height="160" rx="8" fill="#010102"/><text class="h" x="0" y="205">Canvas</text><text class="mono" x="0" y="236">#010102</text>
    <rect class="sw" x="210" width="160" height="160" rx="8" fill="#0f1011"/><text class="h" x="210" y="205">Surface</text><text class="mono" x="210" y="236">#0f1011</text>
    <rect class="sw" x="420" width="160" height="160" rx="8" fill="#f7f8f8"/><text class="h" x="420" y="205">Text</text><text class="mono" x="420" y="236">#f7f8f8</text>
    <rect class="sw" x="630" width="160" height="160" rx="8" fill="#8a8f98"/><text class="h" x="630" y="205">Muted</text><text class="mono" x="630" y="236">#8a8f98</text>
    <rect class="sw" x="840" width="160" height="160" rx="8" fill="#23252a"/><text class="h" x="840" y="205">Hairline</text><text class="mono" x="840" y="236">#23252a</text>
    <rect class="sw" x="1050" width="160" height="160" rx="8" fill="#5e6ad2"/><text class="h" x="1050" y="205">Accent</text><text class="mono" x="1050" y="236">#5e6ad2</text>
  </g>
  <text class="muted" x="120" y="744">原则：先用 surface ladder 和文字层级组织信息，再用强调色提示交互。</text>
</svg>
