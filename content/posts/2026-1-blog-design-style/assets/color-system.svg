<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">网站的颜色系统</title>
  <desc id="desc">展示网站使用的深色背景、白色文字、低对比辅助文字、细分割线和少量强调色。</desc>
  <defs><style>
    .bg{fill:#0f0f0f}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.h{fill:#fff;font:650 24px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 20px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 20px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}.sw{stroke:#3a3a3a;stroke-width:1.2}
  </style></defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">Color system</text>
  <text class="title" x="120" y="146">颜色只做层级，不做装饰主角</text>
  <text class="body" x="120" y="188">大部分页面由黑、白和透明度构成，强调色只在交互和状态里出现。</text>
  <g transform="translate(120 285)">
    <rect class="sw" width="160" height="160" rx="8" fill="#111111"/><text class="h" x="0" y="205">Background</text><text class="mono" x="0" y="236">#111111</text>
    <rect class="sw" x="210" width="160" height="160" rx="8" fill="#ffffff"/><text class="h" x="210" y="205">Text</text><text class="mono" x="210" y="236">#FFFFFF</text>
    <rect class="sw" x="420" width="160" height="160" rx="8" fill="#9e9e9e"/><text class="h" x="420" y="205">Muted</text><text class="mono" x="420" y="236">62% white</text>
    <rect class="sw" x="630" width="160" height="160" rx="8" fill="#333333"/><text class="h" x="630" y="205">Border</text><text class="mono" x="630" y="236">8% white</text>
    <rect class="sw" x="840" width="160" height="160" rx="8" fill="#00f3ff"/><text class="h" x="840" y="205">Cyan</text><text class="mono" x="840" y="236">hover / focus</text>
    <rect class="sw" x="1050" width="160" height="160" rx="8" fill="#ffa500"/><text class="h" x="1050" y="205">Amber</text><text class="mono" x="1050" y="236">state accent</text>
  </g>
  <text class="muted" x="120" y="744">原则：先用透明度建立层级，再用强调色提示交互。</text>
</svg>
