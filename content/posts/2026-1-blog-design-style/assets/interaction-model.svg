<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">轻量交互反馈</title>
  <desc id="desc">展示链接 hover、列表箭头移动和 focus outline 等轻量交互效果。</desc>
  <defs><style>
    .bg{fill:#0f0f0f}.panel{fill:#151515;stroke:#343434;stroke-width:1.3}.box{fill:#1a1a1a;stroke:#3a3a3a;stroke-width:1.2}.focus{fill:#1a1a1a;stroke:#00f3ff;stroke-width:1.6}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.h{fill:#fff;font:650 27px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 20px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}.cyan{fill:#00f3ff}
  </style></defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">Interaction</text>
  <text class="title" x="120" y="146">交互只提示可点击，不制造热闹</text>
  <text class="body" x="120" y="188">hover 和 focus 都很轻，读者注意力仍然留在内容上。</text>
  <rect class="panel" x="160" y="295" width="320" height="240" rx="8"/>
  <text class="h" x="200" y="356">链接 hover</text>
  <text class="cyan" x="200" y="415" style="font:650 26px Instrument Sans,Inter,sans-serif">cyan text</text>
  <text class="mono" x="200" y="470">text-shadow: subtle</text>
  <rect class="panel" x="560" y="295" width="320" height="240" rx="8"/>
  <text class="h" x="600" y="356">列表 hover</text>
  <text class="body" x="600" y="415">轻微变亮</text>
  <text class="mono" x="600" y="470">arrow: →  +3px</text>
  <rect class="panel" x="960" y="295" width="320" height="240" rx="8"/>
  <rect class="focus" x="1000" y="350" width="240" height="80" rx="8"/>
  <text class="h" x="1040" y="400">Focus</text>
  <text class="mono" x="1000" y="470">1px cyan outline</text>
</svg>
