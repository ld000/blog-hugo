<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">字体和信息层级</title>
  <desc id="desc">展示正文标题使用无衬线字体，日期状态等元信息使用等宽字体。</desc>
  <defs><style>
    .bg{fill:#010102}.line{stroke:#23252a;stroke-width:1}.panel{fill:#0f1011;stroke:#34343a;stroke-width:1.3}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Display","PingFang SC",sans-serif}.big{fill:#f7f8f8;font:720 64px "Inter","SF Pro Display","PingFang SC",sans-serif}.h{fill:#f7f8f8;font:650 28px "Inter","SF Pro Display","PingFang SC",sans-serif}.body{fill:#d0d6e0;font:400 22px "Inter","SF Pro Display","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.mono{fill:#d0d6e0;font:500 20px "JetBrains Mono","SFMono-Regular",monospace}.lavender-blue{stroke:#5e6ad2}
  </style></defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">Typography</text>
  <text class="title" x="120" y="146">正文像文章，元信息像系统状态</text>
  <text class="body" x="120" y="188">字体分工让内容和 metadata 在扫描时自然分层。</text>
  <rect class="panel" x="120" y="280" width="560" height="300" rx="8"/>
  <line class="lavender-blue" x1="160" y1="330" x2="280" y2="330" stroke-width="3"/>
  <text class="h" x="160" y="380">Inter / SF Pro</text>
  <text class="big" x="160" y="465">文章标题</text>
  <text class="body" x="160" y="522">正文、摘要、导航，负责阅读。</text>
  <rect class="panel" x="760" y="280" width="560" height="300" rx="8"/>
  <line class="lavender-blue" x1="800" y1="330" x2="920" y2="330" stroke-width="3"/>
  <text class="h" x="800" y="380">JetBrains Mono</text>
  <text class="mono" x="800" y="450">[2026.05.09] / active / 24 posts</text>
  <text class="body" x="800" y="522">日期、状态、数量，负责扫描。</text>
</svg>
