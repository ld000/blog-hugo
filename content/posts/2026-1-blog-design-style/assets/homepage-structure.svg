<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">首页视觉结构保持克制</title>
  <desc id="desc">对比传统重型博客首页和当前站点首页，说明当前设计避免大型 hero 和厚重卡片。</desc>
  <defs>
    <style>
      .bg{fill:#010102}.panel{fill:#0f1011;stroke:#34343a;stroke-width:1.3}.box{fill:#141516;stroke:#34343a;stroke-width:1.2}.line{stroke:#23252a;stroke-width:1}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Display","PingFang SC",sans-serif}.h{fill:#f7f8f8;font:650 28px "Inter","SF Pro Display","PingFang SC",sans-serif}.body{fill:#d0d6e0;font:400 21px "Inter","SF Pro Display","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.mono{fill:#d0d6e0;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}.lavender-blue{stroke:#5e6ad2}
    </style>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <path class="line" d="M120 120h1200M120 724h1200"/>
  <text class="muted" x="120" y="84">Homepage</text>
  <text class="title" x="120" y="146">首页不靠大型 hero 制造气氛</text>
  <text class="body" x="120" y="188">视觉重点放在标题层级、留白和轻量列表上。</text>
  <rect class="panel" x="120" y="270" width="520" height="360" rx="8"/>
  <line class="lavender-blue" x1="160" y1="318" x2="260" y2="318" stroke-width="3"/>
  <text class="h" x="160" y="368">传统博客首页</text>
  <rect class="box" x="160" y="410" width="420" height="64" rx="7"/><text class="body" x="195" y="451">大 Hero / Banner</text>
  <rect class="box" x="160" y="492" width="190" height="88" rx="7"/><text class="body" x="200" y="543">文章卡片</text>
  <rect class="box" x="390" y="492" width="190" height="88" rx="7"/><text class="body" x="430" y="543">文章卡片</text>
  <text class="mono" x="160" y="612">focus: show everything</text>
  <rect class="panel" x="800" y="270" width="520" height="360" rx="8"/>
  <line class="lavender-blue" x1="840" y1="318" x2="940" y2="318" stroke-width="3"/>
  <text class="h" x="840" y="368">克制型首页</text>
  <rect class="box" x="840" y="410" width="420" height="64" rx="7"/><text class="body" x="875" y="451">站点说明</text>
  <rect class="box" x="840" y="492" width="190" height="88" rx="7"/><text class="body" x="884" y="543">AI notes</text>
  <rect class="box" x="1070" y="492" width="190" height="88" rx="7"/><text class="body" x="1102" y="543">Other articles</text>
  <text class="mono" x="840" y="612">focus: quiet layout</text>
</svg>
