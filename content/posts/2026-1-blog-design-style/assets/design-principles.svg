<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">网站设计风格的核心原则</title>
  <desc id="desc">展示这个网站的五个设计原则：近黑画布、克制排版、细线分区、低对比元信息、轻量交互。</desc>
  <defs>
    <style>
      .bg{fill:#010102}.line{stroke:#23252a;stroke-width:1}.card{fill:#0f1011;stroke:#34343a;stroke-width:1.3}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Display","PingFang SC",sans-serif}.h{fill:#f7f8f8;font:650 26px "Inter","SF Pro Display","PingFang SC",sans-serif}.body{fill:#d0d6e0;font:400 21px "Inter","SF Pro Display","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.mono{fill:#d0d6e0;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}.lavender-blue{stroke:#5e6ad2}
    </style>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <path class="line" d="M120 120h1200M120 690h1200"/>
  <text class="muted" x="120" y="84">Design direction</text>
  <text class="title" x="120" y="146">近黑、克制、偏产品界面的博客视觉</text>
  <text class="body" x="120" y="188">视觉目标是降低噪声，让标题、摘要和元信息更容易被扫描。</text>
  <g>
    <rect class="card" x="120" y="285" width="220" height="230" rx="8"/>
    <line class="lavender-blue" x1="150" y1="325" x2="235" y2="325" stroke-width="3"/>
    <text class="h" x="150" y="378">深色系统界面</text>
    <text class="body" x="150" y="422">近黑画布</text>
    <text class="body" x="150" y="454">少量强调色</text>
  </g>
  <g>
    <rect class="card" x="370" y="285" width="220" height="230" rx="8"/>
    <line class="lavender-blue" x1="400" y1="325" x2="485" y2="325" stroke-width="3"/>
    <text class="h" x="400" y="378">克制排版</text>
    <text class="body" x="400" y="422">标题清楚</text>
    <text class="body" x="400" y="454">元信息退后</text>
  </g>
  <g>
    <rect class="card" x="620" y="285" width="220" height="230" rx="8"/>
    <line class="lavender-blue" x1="650" y1="325" x2="735" y2="325" stroke-width="3"/>
    <text class="h" x="650" y="378">细线分区</text>
    <text class="body" x="650" y="422">不用厚卡片</text>
    <text class="body" x="650" y="454">让结构浮出来</text>
  </g>
  <g>
    <rect class="card" x="870" y="285" width="220" height="230" rx="8"/>
    <line class="lavender-blue" x1="900" y1="325" x2="985" y2="325" stroke-width="3"/>
    <text class="h" x="900" y="378">低对比信息</text>
    <text class="body" x="900" y="422">日期、状态、数量</text>
    <text class="body" x="900" y="454">不抢标题</text>
  </g>
  <g>
    <rect class="card" x="1120" y="285" width="220" height="230" rx="8"/>
    <line class="lavender-blue" x1="1150" y1="325" x2="1235" y2="325" stroke-width="3"/>
    <text class="h" x="1150" y="378">轻量交互</text>
    <text class="body" x="1150" y="422">hover 轻微反馈</text>
    <text class="body" x="1150" y="454">不做表演</text>
  </g>
  <text class="mono" x="120" y="744">关键词：Linear / near-black / quiet UI / no heavy cards</text>
</svg>
