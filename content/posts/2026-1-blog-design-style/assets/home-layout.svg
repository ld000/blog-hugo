<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">首页的信息分区</title>
  <desc id="desc">展示首页由站点标题、两个内容入口和最近更新组成。</desc>
  <defs><style>
    .bg{fill:#0f0f0f}.panel{fill:#151515;stroke:#343434;stroke-width:1.3}.box{fill:#1a1a1a;stroke:#3a3a3a;stroke-width:1.2}.line{stroke:#303030;stroke-width:1}.title{fill:#fff;font:650 42px "Instrument Sans","Inter","PingFang SC",sans-serif}.h{fill:#fff;font:650 28px "Instrument Sans","Inter","PingFang SC",sans-serif}.body{fill:#cfcfcf;font:400 21px "Instrument Sans","Inter","PingFang SC",sans-serif}.muted{fill:#9b9b9b;font:400 20px "Instrument Sans","Inter","PingFang SC",sans-serif}.mono{fill:#b8b8b8;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}
  </style></defs>
  <rect class="bg" width="1440" height="900"/>
  <path class="line" d="M120 120h1200M120 760h1200"/>
  <text class="muted" x="120" y="84">Home layout</text>
  <text class="title" x="120" y="146">第一屏完成分流，第二屏承接更新</text>
  <text class="body" x="120" y="188">首页不追求复杂模块，只保留最有用的入口。</text>
  <rect class="panel" x="260" y="260" width="920" height="430" rx="8"/>
  <rect class="box" x="310" y="305" width="820" height="90" rx="7"/>
  <text class="h" x="350" y="360">站点标题 + 简短说明</text>
  <rect class="box" x="310" y="430" width="395" height="120" rx="7"/>
  <text class="h" x="350" y="485">AI notes</text><text class="mono" x="350" y="520">notes / latest / active</text>
  <rect class="box" x="735" y="430" width="395" height="120" rx="7"/>
  <text class="h" x="775" y="485">Other articles</text><text class="mono" x="775" y="520">posts / latest / indexed</text>
  <rect class="box" x="310" y="585" width="820" height="60" rx="7"/>
  <text class="h" x="350" y="625">最近更新</text>
  <text class="muted" x="120" y="812">结构顺序：先说明站点，再选择分区，最后看更新。</text>
</svg>
