<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">内容分区决定页面结构</title>
  <desc id="desc">展示不同内容分区在页面视觉上使用统一的标题、元信息和列表规则。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2l8 4-8 4z" fill="#5e6ad2"/></marker>
    <style>
      .bg{fill:#010102}.panel{fill:#0f1011;stroke:#34343a;stroke-width:1.3}.box{fill:#141516;stroke:#34343a;stroke-width:1.2}.edge{fill:none;stroke:#5e6ad2;stroke-width:2;marker-end:url(#arrow)}.line{stroke:#23252a;stroke-width:1}.title{fill:#f7f8f8;font:650 42px "Inter","SF Pro Display","PingFang SC",sans-serif}.h{fill:#f7f8f8;font:650 27px "Inter","SF Pro Display","PingFang SC",sans-serif}.body{fill:#d0d6e0;font:400 21px "Inter","SF Pro Display","PingFang SC",sans-serif}.muted{fill:#8a8f98;font:400 20px "Inter","SF Pro Display","PingFang SC",sans-serif}.mono{fill:#d0d6e0;font:500 18px "JetBrains Mono","SFMono-Regular",monospace}
    </style>
  </defs>
  <rect class="bg" width="1440" height="860"/>
  <path class="line" d="M120 120h1200M120 724h1200"/>
  <text class="muted" x="120" y="84">Content structure</text>
  <text class="title" x="120" y="146">不同分区保持同一套视觉语言</text>
  <text class="body" x="120" y="188">标题、状态字段和列表样式在各分区保持一致。</text>
  <rect class="panel" x="140" y="300" width="330" height="250" rx="8"/>
  <text class="h" x="185" y="360">content/ai</text><text class="body" x="185" y="405">AI 笔记</text><text class="mono" x="185" y="445">models / tools / workflow</text>
  <rect class="panel" x="555" y="300" width="330" height="250" rx="8"/>
  <text class="h" x="600" y="360">content/posts</text><text class="body" x="600" y="405">普通文章</text><text class="mono" x="600" y="445">engineering / notes</text>
  <rect class="panel" x="970" y="300" width="330" height="250" rx="8"/>
  <text class="h" x="1015" y="360">content/springweek</text><text class="body" x="1015" y="405">归档内容</text><text class="mono" x="1015" y="445">archive</text>
  <path class="edge" d="M305 550c170 110 660 110 830 0"/>
  <text class="muted" x="505" y="655">统一视觉规则让不同内容区看起来属于同一个系统。</text>
</svg>
